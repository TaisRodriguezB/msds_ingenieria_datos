# Taller 3 - MSDS 6012 Ingenieria de Datos - USFQ
# Grupo 15: Gandhi Mora, Tais Rodriguez
#
# Stack: Zookeeper + Kafka + Kafka-UI + Zeppelin (Spark local incluido en la imagen de Zeppelin)
version: "3.8"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - bigdata-net

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - bigdata-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8088:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - bigdata-net

  zeppelin:
    image: apache/zeppelin:0.11.2
    container_name: zeppelin
    depends_on:
      - kafka
    ports:
      - "8085:8080"
    environment:
      ZEPPELIN_ADDR: 0.0.0.0
      ZEPPELIN_PORT: 8080
    volumes:
      - zeppelin-data:/zeppelin/notebook
    networks:
      - bigdata-net

networks:
  bigdata-net:
    driver: bridge

volumes:
  zeppelin-data:
